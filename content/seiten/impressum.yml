text_1: "## Angaben gemäß § 5 DDG"
text_2: |-
  ## Kontakt

  Du erreichst mich per E-Mail und Telefon. Gesprächszeiten: Montag bis Freitag 17–19 Uhr, Samstag 9–13 Uhr. Persönliche Termine nur nach Vereinbarung.

  ## Tätigkeit

  Schlafberatung für Familien mit Babys und Kindern. Das Angebot ist keine medizinische oder psychotherapeutische Behandlung.

  ## Verbraucherstreitbeilegung

  Ich bin nicht bereit und nicht verpflichtet, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.

  ## Inhalte und Bildrechte

  Quellen und Lizenzinformationen der verwendeten Fotos und Schriften findest du unter [Bildnachweise](bildnachweise.html). Die abgebildeten Personen auf Symbolfotos sind keine Kundenreferenzen.
