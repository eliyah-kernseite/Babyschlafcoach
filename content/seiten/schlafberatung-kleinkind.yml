button_3: Alle Fragen
fragen:
  - frage: Unser Kind kommt jede Nacht ins Elternbett. Ist das ein Problem?
    antwort: Nur, wenn es euch stört. Viele Familien schlafen gern eng beieinander. Wenn ihr euch aber mehr Platz oder ruhigere Nächte wünscht, suchen wir einen Weg, den euer Kind versteht. Strafen braucht es dafür nicht.
  - frage: Hilft eine Schlafberatung beim Kita-Start?
    antwort: Ein neuer Alltag wirbelt den Schlaf oft ordentlich durcheinander, etwa wenn sich der Mittagsschlaf verschiebt oder ganz wegfällt. Dann passen wir Tagesablauf, Schlafenszeit und Abendritual gemeinsam an. Solche Übergänge kenne ich aus der Kindertagespflege sehr gut.
  - frage: Wie lange dauert eine Umstellung bei Kleinkindern?
    antwort: Das ist bei jedem Kind anders, eine feste Zahl an Nächten verspreche ich nicht. Bei Kleinkindern lohnt sich oft eine Begleitung über ein paar Wochen, damit wir den Plan an das anpassen können, was ihr zu Hause erlebt.
