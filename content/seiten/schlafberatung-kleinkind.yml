text_1: |-
  ## Kleinkinder von 1 bis 3 Jahren

  Zwischen eins und drei passiert unglaublich viel. Euer Kind lernt laufen und sprechen, vielleicht steht der Kita-Start an, und irgendwann fällt der Vormittagsschlaf weg. Typisch für diese Zeit sind zum Beispiel:

  ✓ Einschlafen klappt nur mit Mama oder nur mit Papa
  ✓ Der Tagschlaf passt nicht mehr zum Alltag
  ✓ Kita-Start und neue Abläufe bringen den Schlaf durcheinander
  ✓ Häufiges Aufwachen und lange Wachphasen in der Nacht

  Hängt das Einschlafen bisher an einer Person, hilft oft ein Wechsel in Etappen. Erst übernimmt der andere Elternteil einzelne Teile vom Abendritual, dann ist er beim Einschlafen mit dabei, und irgendwann macht er es allein. Dass euer Kind das anfangs nicht gut findet und auch deutlich zeigt, ist normal, und natürlich wird es dabei getröstet.

  ## Kindergartenkinder von 3 bis 6 Jahren

  Ältere Kinder machen oft richtig gut mit, sobald sie verstehen, was sich ändern soll. Hier geht es häufig um:

  ✓ Abendroutinen, die jeden Abend länger werden
  ✓ Ängste beim Einschlafen
  ✓ Nächtliches Wandern ins Elternbett
  ✓ Unterschiedliche Bedürfnisse bei Geschwistern

  Zusammen machen wir einen Plan, den ihr im Alltag auch durchhalten könnt und bei dem euer Kind ernst genommen wird. Mit Strafen oder Schreienlassen arbeite ich dabei nicht.
text_2: |-
  ### Passend für euch

  Bei Kleinkindern lohnt sich meist eine Begleitung über mehrere Wochen, zum Beispiel [Intensiv](preise.html#intensiv) mit drei Folgegesprächen.
