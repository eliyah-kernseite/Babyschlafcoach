text_2: |-
  ## Wenn der Schlaf den ganzen Familienalltag bestimmt

  {.lead} Wahrscheinlich seid ihr ziemlich müde, und von den vielen Ratschlägen, die sich gegenseitig widersprechen, vermutlich auch.

  Vielleicht zieht sich bei euch der Abend über Stunden, weil euer Kind einfach nicht einschläft, oder es wacht nachts so oft auf, dass an Durchschlafen nicht zu denken ist. Bei anderen klappt das Einschlafen nur mit Mama oder nur mit Papa, oder Kita-Start und Tagschlaf haben den ganzen Ablauf durcheinandergebracht.

  Das schauen wir uns gemeinsam an, mit Blick auf euer Kind und euren Alltag. Wer woran schuld ist, spielt dabei keine Rolle. Bei Neugeborenen geht es vor allem um Orientierung und einen sicheren Schlafplatz.

  Wie ich genau arbeite, steht auf der Seite zur Schlafberatung.
button_3: Meine Arbeitsweise
abschnitt_2:
  titel: Wie die Beratung abläuft
  text: Vom ersten Gespräch bis zur Begleitung im Alltag wisst ihr immer, was als Nächstes kommt.
schritte:
  - titel: Kennenlernen
    text: 20 Minuten, kostenlos. Ihr erzählt mir, was euch gerade belastet.
  - titel: Eure Situation verstehen
    text: Fragebogen und Beratungsgespräch geben uns ein genaues Bild davon, wie euer Alltag aussieht.
  - titel: Ein Plan für euch
    text: Ihr bekommt konkrete nächste Schritte schriftlich, abgestimmt auf das Alter eures Kindes.
  - titel: Begleitung
    text: In der gebuchten Zeit könnt ihr mich jederzeit anschreiben, und wenn etwas nicht klappt, ändern wir den Plan.
