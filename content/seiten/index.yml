button_10: Zur Schlafberatung
hauptueberschrift: Babyschlafberatung online in ganz Deutschland, mit Nähe und ganz ohne Schreienlassen
text_1: |-
  {.lead} Wenn das Einschlafen jeden Abend ewig dauert und ihr nachts kaum noch am Stück schlaft, helfen gut gemeinte Tipps von allen Seiten meistens wenig. Was dann hilft, ist jemand, der sich eure Situation in Ruhe anhört und euch beim Verändern begleitet.

  Mein Name ist **Anna-Lena Korb**, ich bin **zertifizierte Babyschlafberaterin** und arbeite seit 2010 als Tagesmutter. Ich begleite Familien mit Kindern bis sechs Jahre, zum Beispiel bei [langen Einschlafabenden](baby-einschlafen.html), bei [häufigem nächtlichen Aufwachen](baby-durchschlafen.html), wenn der Tagschlaf nicht klappt oder das Einschlafen nur noch mit einer bestimmten Person funktioniert.

  Beraten wird [online per Zoom oder Telefon](online-schlafberatung.html), ob ihr nun in Hamburg, Berlin, Köln oder München wohnt oder irgendwo auf dem Land. Wer im [Raum Würzburg](schlafberatung-wuerzburg.html) lebt, kann mich auch persönlich treffen. Das erste Gespräch ist **kostenlos und unverbindlich**.
button_2: Mehr über mich
abschnitt_1:
  titel: Meine Schlafberatung im Überblick
  text: Ein Baby mit vier Monaten hat andere Themen als ein Kindergartenkind. Hier findet ihr die Seite, die zu eurer Familie passt.
