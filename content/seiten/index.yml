button_11: Online-Beratung
text_4: |-
  ## Was die Beratung kostet

  Das Kennenlernen ist kostenlos. Danach könnt ihr euch in Ruhe überlegen, ob euch eine einzelne Sprechstunde reicht oder ob ihr euch über mehrere Wochen begleiten lassen wollt. Alle Preise sind Gesamtpreise, es gibt kein Abo, und nichts verlängert sich automatisch.
button_6: Alle Leistungen und Pakete
zitat:
  zitat: Dass euer Kind zum Einschlafen Nähe braucht, ist völlig in Ordnung, und ruhigere Abende dürft ihr euch trotzdem wünschen.
  unterzeile: zertifizierte Babyschlafberaterin
text_5: |-
  ## Wer euch berät

  Seit 2010 betreue ich als qualifizierte Kindertagespflegeperson Babys und Kleinkinder, rund 100 Kinder waren es bisher. Lange Einschlafabende kenne ich außerdem von meinem eigenen Kind.

  2026 habe ich zusätzlich die Ausbildung zur Babyschlafberaterin abgeschlossen. Von mir bekommt ihr eine ehrliche Einschätzung und einen konkreten Plan, und beim Umsetzen lasse ich euch nicht allein.
