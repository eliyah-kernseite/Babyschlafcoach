abschnitt_3:
  titel: Ratgeber für müde Eltern
  text: Hier findet ihr Artikel zu den Fragen, die Eltern besonders oft beschäftigen, jeweils mit Links zu den Quellen. Eine persönliche Beratung ersetzen sie natürlich nicht.
text_6: |-
  ## Häufige Fragen zur Schlafberatung

  Ein paar Antworten schon mal vorab.
button_9: Alle Fragen und Antworten
fragen:
  - frage: Für welche Familien ist die Babyschlafberatung gedacht?
    antwort: Für Eltern von Babys und Kindern bis sechs Jahre, die sich ruhigere Abende oder Nächte wünschen und ihr Kind dafür nicht schreien lassen möchten. Ob euer Kind ein paar Wochen alt ist oder schon in den Kindergarten geht, Ziele und Tempo richten wir nach ihm und nach eurem Alltag.
  - frage: Wie läuft die Beratung online ab?
    antwort: Nach dem kostenlosen Kennenlernen bekommt ihr je nach Paket einen Fragebogen, bei Intensiv und Premium zusätzlich ein Schlafprotokoll. Das eigentliche Beratungsgespräch führen wir per Zoom oder Telefon, und danach bekommt ihr euren schriftlichen Plan. Wie das im Einzelnen aussieht, steht unter [Ablauf](ablauf.html).
  - frage: Was unterscheidet deine Beratung von Schlafprogrammen?
    antwort: Ich arbeite mit keinem festen Programm, das bei jedem Kind gleich abläuft. Wir schauen uns euer Kind an, euren Tag und das, was ihr verändern wollt. Daraus wird ein Plan in kleinen Schritten, bei dem ihr euer Kind weiter trösten und nah bei ihm sein könnt.
  - frage: Wie schnell ist ein Termin möglich?
    antwort: Für das Kennenlernen brauche ich mindestens sieben Tage Vorlauf. Da ich höchstens drei Familien gleichzeitig begleite, besprechen wir im Gespräch, wann eure Beratung losgehen kann.
