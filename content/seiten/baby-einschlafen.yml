text_1: |-
  ## Warum Einschlafen für Babys so anspruchsvoll ist {#warum}

  Einschlafen ist ein Übergang vom wachen Zustand in den Schlaf, und dafür muss ein Kind zur Ruhe kommen und sich sicher fühlen. Allein schaffen Babys und kleine Kinder das noch nicht, sie brauchen Erwachsene, die ihnen dabei Halt geben. Eure Aufgabe ist also, euer Kind durch diesen Übergang zu begleiten, und das darf ruhig sanft passieren.

  Wenn euer Kind beim Einschlafen eure Nähe sucht, hat es sich deshalb nichts „Schlechtes angewöhnt“, und ihr habt auch nichts falsch gemacht. Zum Thema wird das erst, wenn der Ablauf euch auf Dauer überfordert oder ihr euch mehr Flexibilität wünscht.

  ## Müdigkeit erkennen, bevor sie kippt {#muedigkeit}

  Viele lange Abende haben weniger mit dem Einschlafen selbst zu tun als mit dem Zeitpunkt. Ist ein Kind noch nicht müde genug, wird es unruhig. Ist es übermüdet, wirkt es oft paradoxerweise aufgedreht.

  - Gähnen, Augenreiben, Ziehen an den Ohren
  - Ein starrer, abwesender Blick oder Wegdrehen
  - Quengeln und weniger Interesse an Spiel und Umgebung

  Achtet eine Woche lang darauf, wann diese Zeichen auftreten. Mit einem einfachen Schlafprotokoll erkennt ihr Muster, die im Alltag sonst untergehen. Schaut dabei vor allem auf euer Kind und weniger auf die Uhr, denn wie lange Kinder wach bleiben können, ist sehr verschieden.

  ## Ein Abendritual, das wirklich trägt {#ritual}

  Ein gutes Abendritual ist kurz, vorhersehbar und ruhig und zeigt eurem Kind: Gleich wird geschlafen. Was genau ihr dabei macht, ist gar nicht so wichtig. Hauptsache, es läuft jeden Abend ungefähr gleich ab.

  - Immer die gleiche Reihenfolge, zum Beispiel Wickeln, Schlafanzug, Licht dimmen, ein Lied
  - Etwa 20 bis 30 Minuten, länger muss es nicht sein
  - Möglichst ruhig, mit gedämpftem Licht und ohne Bildschirm
  - Ein Ablauf, den auch der andere Elternteil übernehmen kann

  ## Wenn Einschlafen nur mit einer Person klappt {#nur-mit-mama}

  Das kennen sehr viele Familien. Euer Kind schläft nur bei Mama ein oder nur bei Papa, und wer gerade „dran“ ist, hat abends praktisch keine Zeit mehr für sich.

  Hilfreich ist ein schrittweiser Wechsel. Der andere Elternteil übernimmt zuerst Teile des Rituals, später ist er beim Einschlafen dabei und schließlich allein zuständig. Dass ein Kind die Veränderung erst einmal nicht gut findet und das zeigt, ist normal. Es darf dabei getröstet werden, und es bleibt ja eine vertraute Person bei ihm.

  ## Veränderung in kleinen Schritten {#schritte}

  Stellt nicht alles auf einmal um. Nehmt euch eine Sache vor und bleibt dabei ein paar Tage verlässlich, dann kann sich euer Kind darauf einstellen, und ihr seht, was wirklich etwas bringt.

  Kontrolliertes Schreienlassen braucht es dafür nicht. Ihr bleibt ansprechbar und tröstet, wenn euer Kind euch braucht. Konsequent sein heißt hier, freundlich bei dem zu bleiben, was ihr euch vorgenommen habt, und trotzdem auf die Signale eures Kindes zu achten.

  ## Sicher einschlafen {#sicher}

  Egal, wie ihr euer Baby in den Schlaf begleitet: Hingelegt wird es auf den Rücken, im Schlafsack statt unter einer Decke und auf einer eher festen Matratze ohne Kissen, Nestchen oder Felle. Das eigene Bett steht am besten im Elternschlafzimmer, die Luft ist rauchfrei, und euer Baby ist nicht zu warm angezogen. So fasst das Bundesinstitut für Öffentliche Gesundheit (BIÖG) die wichtigsten Punkte zusammen.

  Alles im Detail: [BIÖG: Die richtige Schlafumgebung für das Baby](https://www.kindergesundheit-info.de/themen/schlafen/0-12-monate/schlafumgebung/).

  ## Wann Hilfe sinnvoll ist {#hilfe}

  Kosten euch die Abende schon seit Wochen alle Kraft und dreht ihr euch mit den vielen widersprüchlichen Ratschlägen nur noch im Kreis, kann ein Blick von außen helfen. In einer [Schlafberatung für Babys](schlafberatung-baby.html) schauen wir uns euren Alltag zusammen an und machen einen Plan, der zu euch passt.

  Wenn ihr gesundheitliche Ursachen vermutet, etwa Atemauffälligkeiten, Schmerzen oder Trinkschwierigkeiten, ist zuerst die Kinderarztpraxis die richtige Anlaufstelle.

  ## Häufige Fragen zum Einschlafen {#fragen}
fragen:
  - frage: Ist es schlimm, wenn mein Baby nur an der Brust oder mit Fläschchen einschläft?
    antwort: Nein. In den ersten Lebensmonaten ist das sogar sehr häufig. Zum Thema wird es eigentlich erst, wenn es euch belastet oder ihr gern etwas flexibler wärt. Dann lassen sich die Abläufe nach und nach verändern, auch ohne abzustillen.
  - frage: Wie lange darf das Einschlafen dauern?
    antwort: Eine feste Regel gibt es nicht. Dauert das Einschlafen aber über Wochen fast jeden Abend sehr lange und geht euch dabei der halbe Abend verloren, lohnt sich ein Blick auf Schlafenszeit, Tagschlaf und den Ablauf davor. Oft liegt es am Timing.
  - frage: Ab wann kann ein Kind selbstständig einschlafen?
    antwort: Ein festes Alter dafür gibt es nicht. Manche Kinder schlafen schon früh allein ein, andere brauchen noch lange jemanden dabei. Selbstständiger einzuschlafen kann ein Ziel sein, muss es aber nicht. Bei Neugeborenen ist es ohnehin kein sinnvolles Ziel.
