text_1: |-
  Die Fotografien illustrieren familiäre Nähe. Abgebildete Personen sind keine Darstellung von Anna-Lena Korb und keine Kundenreferenzen.

  ## Fotografien von Unsplash
text_2: |-
  Alle Aufnahmen wurden unter der kostenlosen Unsplash-Lizenz bezogen und werden lokal eingebunden, ohne Verbindung zu Unsplash beim Seitenaufruf. Die Lizenz erlaubt die kostenlose kommerzielle Nutzung ohne Namensnennung; die Urheber werden hier trotzdem genannt. Sie hebt Rechte abgebildeter Personen und Marken nicht pauschal auf.

  ## Schriften

  Manrope und Newsreader, lokal eingebunden unter der SIL Open Font License 1.1 ([Lizenz Manrope](assets/MANROPE-LICENSE.txt), [Lizenz Newsreader](assets/NEWSREADER-LICENSE.txt)). Beim Seitenaufruf wird keine Verbindung zu Google Fonts aufgebaut.

  ## Zertifikat

  Das Abschlusszertifikat wurde von Anna-Lena Korb für diese Website bereitgestellt. Die Bilddatei zeigt das Originaldokument unverändert. Es wurden keine Aussagen oder Siegel hinzugefügt.
