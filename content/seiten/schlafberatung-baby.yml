text_4: "## Häufige Fragen zum Babyschlaf"
button_2: Alle Fragen
fragen:
  - frage: Ab wann ist eine Babyschlafberatung sinnvoll?
    antwort: Schon in den ersten Lebenswochen. Bei Neugeborenen sprechen wir vor allem über Orientierung, den sicheren Schlafplatz und darüber, wie ihr euch die Nächte aufteilen könnt. Ab etwa vier Monaten werden Tagesrhythmus und Einschlafbegleitung wichtiger.
  - frage: Darf mein Baby beim Stillen oder im Arm einschlafen?
    antwort: Ja. Im ersten Lebensjahr ist das ganz normal. Falls es euch mit der Zeit zu viel wird, verändern wir die Abläufe nach und nach, abstillen müsst ihr deswegen nicht. Ernährung und ein sicherer Schlafplatz gehen dabei immer vor.
  - frage: Muss unser Baby im eigenen Zimmer schlafen?
    antwort: Nein. Für das erste Lebensjahr empfiehlt das BIÖG ein eigenes Bett im Elternschlafzimmer. Wenn wir am selbstständigeren Einschlafen arbeiten, heißt das also nicht, dass euer Baby allein in einem anderen Zimmer schlafen soll.
