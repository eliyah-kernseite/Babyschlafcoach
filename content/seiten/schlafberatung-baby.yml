kopf:
  titel: Schlafberatung für Babys im ersten Lebensjahr
  text: Im ersten Lebensjahr verändert sich der Schlaf gefühlt jeden Monat, und kaum habt ihr euch auf etwas eingestellt, ist es schon wieder anders. Ich helfe euch, euer Baby besser zu verstehen und die Abende wieder in den Griff zu bekommen.
  bild: /assets/bilder/einschlafen.webp
  ausschnitt: 50% 45%
text_1: |-
  ## Neugeborene brauchen kein Schlaftraining

  In den ersten drei Monaten muss euer Baby weder allein einschlafen noch durchschlafen. Wir sprechen eher darüber, wie ihr euch zurechtfindet, wie ein **sicherer Schlafplatz** aussieht und wie ihr selbst zu etwas Schlaf kommt.

  Dazu gehört, Müdigkeitszeichen zu erkennen, den Tag ein bisschen im Blick zu haben und zu überlegen, wie ihr euch die Nächte aufteilt. Dass euer Baby an der Brust, mit dem Fläschchen oder auf dem Arm einschläft, ist in diesem Alter völlig normal.

  ## Babys von 4 bis 12 Monaten

  Ab etwa vier Monaten bildet sich langsam ein Rhythmus heraus. In der Beratung geht es dann häufig um diese Themen:

  ✓ Ein Tagesrhythmus, der zum Alter passt
  ✓ Einschlafen, das jeden Abend sehr lange dauert
  ✓ Häufiges nächtliches Aufwachen
  ✓ Einschlafen nur an der Brust, im Arm oder mit einer Person
  ✓ Kurze Tagschläfe und übermüdete Abende

  Verändert wird immer nur so viel, wie euer Baby und ihr gut mitmachen könnt. Wenn es Trost braucht, bekommt es ihn auch.

  ## Sicherer Schlaf hat Vorrang

  Bei Säuglingen hat ein sicherer Schlafplatz immer Vorrang. Das Bundesinstitut für Öffentliche Gesundheit (BIÖG) empfiehlt unter anderem die Rückenlage, einen Schlafsack statt einer Decke, eine eher feste Matratze ohne Kissen, Nestchen oder Felle, ein eigenes Bett im Elternschlafzimmer, eine rauchfreie Umgebung und keine zu warme Kleidung. Ausführlich nachlesen könnt ihr das hier: [BIÖG: Die richtige Schlafumgebung für das Baby](https://www.kindergesundheit-info.de/themen/schlafen/0-12-monate/schlafumgebung/).
text_2: |-
  ### Passend für euch

  Für die meisten Familien mit Babys passt das Paket [Basis](preise.html#basis) oder [Intensiv](preise.html#intensiv). Habt ihr nur eine einzelne Frage, reicht oft die [Schlafsprechstunde](preise.html#sprechstunde).
