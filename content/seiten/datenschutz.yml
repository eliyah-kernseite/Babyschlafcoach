text_1: "## 1. Verantwortliche"
text_2: |-
  ## 2. Aufruf der Website und Hosting

  Diese Website liegt bei Hostinger. Anbieter ist Hostinger, UAB, Švitrigailos g. 34, 03230 Vilnius, Litauen. Die Server stehen in Frankfurt am Main. Beim Seitenaufruf verarbeitet Hostinger technische Verbindungsdaten, insbesondere die IP-Adresse, Datum und Uhrzeit sowie die abgerufene Seite. Dies ist für die Auslieferung und Sicherheit der Website erforderlich. Grundlage ist mein berechtigtes Interesse an einer funktionsfähigen und sicheren Website nach Art. 6 Abs. 1 Buchstabe f DSGVO.

  Weitere Informationen enthält die [Datenschutzerklärung von Hostinger](https://www.hostinger.com/legal/privacy-policy).

  ## 3. Terminanfrage über das Formular

  Wenn du das Formular auf der Kontaktseite absendest, werden Name, E-Mail-Adresse, Angebotsauswahl, Gesprächsformat, Wunschtermine und deine optionale Nachricht an den Formulardienst Web3Forms übertragen und von dort als E-Mail an mein Postfach weitergeleitet. Anbieter ist Web3Creative, Indien. Web3Forms speichert die Anfrage für höchstens 7 Tage und löscht sie danach. Für die Übermittlung in ein Land außerhalb der EU nutzt der Anbieter EU-Standardvertragsklauseln. Einzelheiten beschreibt die [Datenschutzerklärung von Web3Forms](https://web3forms.com/privacy). Rechtsgrundlage ist Art. 6 Abs. 1 Buchstabe b DSGVO.

  Der Kalender ruft keine privaten Kalenderdaten ab und reserviert keine Termine. Beim bloßen Aufruf der Kontaktseite wird keine Verbindung zu Web3Forms aufgebaut, sondern erst beim Absenden.

  Falls der Versand einmal nicht klappt, bietet die Seite an, die Anfrage als E-Mail-Entwurf zu öffnen. Mit „Im E-Mail-Programm öffnen“ übergibst du ihn an dein Mailprogramm, mit „In Gmail öffnen“ an Google. Diese E-Mail sendest du dann selbst ab.

  ## 4. E-Mail, Telefon und Anfragen

  Wenn du Kontakt aufnimmst, verarbeite ich deine Kontaktdaten, Nachricht und gegebenenfalls die ausgewählten Termine zur Beantwortung und Vorbereitung der Beratung. Rechtsgrundlage ist Art. 6 Abs. 1 Buchstabe b DSGVO für vorvertragliche und vertragliche Anliegen; bei sonstigen Anfragen mein berechtigtes Interesse an der Bearbeitung nach Art. 6 Abs. 1 Buchstabe f DSGVO.

  Das angegebene Postfach nutzt Gmail. Google verarbeitet die E-Mail-Kommunikation als beteiligter Dienstanbieter. Für Nutzer im Europäischen Wirtschaftsraum benennt Google grundsätzlich Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Eine Verarbeitung außerhalb der EU ist möglich. Einzelheiten zu Zwecken, Speicherdauer, Empfängern und Übermittlungsgrundlagen beschreibt die [Datenschutzerklärung von Google](https://policies.google.com/privacy?hl=de).

  Bitte übermittle bei der ersten Anfrage keine medizinischen Befunde oder ausführlichen Gesundheitsdaten deines Kindes. Für sensible Informationen wird vor der Beratung ein geeigneter Kommunikationsweg abgestimmt.

  Anfragedaten werden gelöscht, sobald die Bearbeitung abgeschlossen ist und keine weitere Aufbewahrung erforderlich ist. Gesetzliche Aufbewahrungspflichten sowie die Durchsetzung oder Abwehr von Ansprüchen können eine längere Aufbewahrung erfordern.

  ## 5. Zoom und WhatsApp während einer Beratung

  Zoom und WhatsApp sind auf dieser Website nicht eingebettet. Beim bloßen Seitenbesuch werden deshalb keine Daten an diese Dienste übermittelt. Wenn ihr sie im Rahmen einer vereinbarten Beratung nutzen möchtet, werden Kommunikationsweg und entsprechende Datenschutzhinweise vorab abgestimmt. Die Kontaktaufnahme ist auch per Telefon oder E-Mail möglich.

  ## 6. Bilder, Schrift, Cookies und externe Links

  Fotos, Zertifikat und die Schriften Manrope und Newsreader werden vom selben Hosting wie die Website geladen. Es sind keine externen Schriften, Karten, Social-Media-Feeds, Analyse- oder Werbedienste eingebunden. Die Website setzt keine Cookies und legt keine Browser-Webspeichereinträge an.

  Erst beim Anklicken eines externen Links rufst du den jeweiligen Drittanbieter auf. Es gelten dessen Datenschutzhinweise. Das betrifft insbesondere Gmail, das Kinderkörbchen und die verlinkten Fachinformationen.

  ## 7. Deine Rechte

  Unter den gesetzlichen Voraussetzungen hast du Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Datenübertragbarkeit (Art. 15 bis 20 DSGVO). Eine erteilte Einwilligung kannst du jederzeit mit Wirkung für die Zukunft widerrufen.

  Widerspruch: Soweit Daten aufgrund berechtigter Interessen verarbeitet werden, kannst du aus Gründen deiner besonderen Situation nach Art. 21 DSGVO widersprechen. Wende dich dafür an die oben genannte E-Mail-Adresse.

  ## 8. Beschwerderecht

  Du kannst dich bei einer Datenschutzaufsichtsbehörde beschweren. Für nichtöffentliche Stellen in Bayern ist das [Bayerische Landesamt für Datenschutzaufsicht (BayLDA)](https://www.lda.bayern.de/) zuständig.
