text_3: |-
  ## Wie ich arbeite

  Kontrolliertes Schreienlassen kommt bei mir nicht vor, und eine Durchschlafgarantie gebe ich auch keine. Was ich euch geben kann, ist eine ehrliche Einschätzung und ein Plan, der zu eurem Kind passt. Und weil ich nie mehr als drei Familien gleichzeitig begleite, habe ich für eure Fragen auch wirklich Zeit.

  Wenn euer Kind zum Einschlafen Nähe braucht, ist das für mich der Punkt, an dem wir ansetzen. Verändert wird nur so viel, wie euer Kind und ihr gut mitgehen könnt.
