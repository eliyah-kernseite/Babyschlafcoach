seo:
  titel: Über Anna-Lena Korb – Babyschlafberaterin & Tagesmutter
  beschreibung: "Zertifizierte Babyschlafberaterin aus Eisingen bei Würzburg: Kindertagespflege seit 2010, rund 100 betreute Kinder, Montessori-Diplom und Kinderyoga."
  menuename: Über mich
kopf:
  titel: Hallo, ich bin Anna-Lena Korb
  text: Ich bin zertifizierte Babyschlafberaterin, qualifizierte Kindertagespflegeperson und seit 2005 Mama. Ich lebe in Eisingen bei Würzburg und berate Familien online in ganz Deutschland.
text_1: |-
  ## Mein Alltag mit kleinen Kindern

  Seit 2010 bin ich Tagesmutter in meiner Kindertagespflege, dem <a href="{{kinderkoerbchen_url}}" target="_blank" rel="noopener">Kinderkörbchen in Eisingen</a>. Rund 100 Kinder habe ich seitdem begleitet, die meisten waren zwischen null und drei Jahre alt. Jedes kam mit seinem eigenen Tempo, und jedes brauchte unterschiedlich viel Nähe.

  Schlafen und Ausruhen gehören bei uns genauso zum Tag wie Spielen und Entdecken. Dabei sehe ich immer wieder, wie unterschiedlich Kinder zur Ruhe kommen und wie viel es bringt, genau hinzuschauen.

  Mir fällt seit einiger Zeit auf, dass immer mehr Eltern beim Thema Schlaf den Überblick verlieren und nicht mehr weiterwissen. Die Kinder schlafen schlecht, die Eltern auch, und dabei brauchen gerade kleine Kinder guten Schlaf, um sich gut entwickeln zu können. Deshalb habe ich die Ausbildung zur Babyschlafberaterin gemacht. Ich möchte den Kindern helfen, und damit natürlich auch ihren Eltern.
