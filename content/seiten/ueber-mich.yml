text_2: |-
  ## Auch bei uns war Einschlafen nicht einfach „Augen zu“

  {.lead} Als mein Kind etwa eineinhalb Jahre alt war, klappte das Einschlafen nur mit mir. Ich weiß also, wie es sich anfühlt, gebraucht zu werden und sich gleichzeitig nach einem freien Abend zu sehnen. Wir haben das damals ganz gut hinbekommen, und wenn ich heute zurückschaue, kann ich mich wirklich nicht beschweren.

  Das heißt natürlich nicht, dass es bei euch genauso ist. Aber es erinnert mich daran, erst einmal zuzuhören und zu verstehen, was euch belastet, bevor wir irgendetwas verändern.

  {.signature} Eure Anna-Lena
