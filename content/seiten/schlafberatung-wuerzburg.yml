text_4: |-
  ## Für Familien in Würzburg und Umgebung

  Zum Umkreis von etwa 10 bis 15 Kilometern gehören zum Beispiel die Würzburger Stadtteile von der Zellerau bis Heidingsfeld, Lengfeld und Versbach, und Orte wie Eisingen, Höchberg, Waldbüttelbrunn, Kist, Gerbrunn, Veitshöchheim, Zell am Main oder Randersacker. Wohnt ihr weiter weg, ist die Online-Beratung einfach die bequemere Lösung.

  ## Wo der persönliche Termin stattfindet

  Wo wir uns treffen, machen wir zusammen aus. Hauptsache, ihr könnt in Ruhe erzählen und euer Kind ist gut versorgt. Folgegespräche können wir gern per Zoom oder Telefon führen, wenn das im Alltag einfacher für euch ist.

  ## Typische Anliegen von Familien aus der Region

  Die Themen unterscheiden sich nicht von denen anderswo. Es geht um lange Einschlafabende, häufiges Aufwachen oder einen Tagschlaf, der nicht mehr passt, oft auch um den Start in Krippe, Kita oder Tagespflege. Gerade diese Übergänge kenne ich aus dem Kinderkörbchen sehr gut.
text_5: |-
  ### Lieber erst online?

  Auch als Familie aus Würzburg könnt ihr ganz normal mit dem kostenlosen Kennenlernen per Zoom oder Telefon anfangen und danach entscheiden, ob ihr euch persönlich treffen wollt.
