text_1: |-
  ## Persönlich vor Ort, wenn ihr das möchtet

  In Würzburg und im Umkreis von etwa 10 bis 15 Kilometern können wir **persönliche Termine nach Absprache** ausmachen, eine Anfahrtspauschale kommt nicht dazu. Eine offene Sprechstunde, zu der man einfach vorbeikommt, gibt es allerdings nicht.

  Auch wenn ihr in der Nähe wohnt, kann die [Online-Beratung](online-schlafberatung.html) praktischer sein, weil sie zeitlich flexibler ist und beide Elternteile leichter dabei sein können. Man kann auch beides mischen, zum Beispiel das Erstgespräch persönlich und die Folgegespräche per Zoom.

  ## Seit 2010 mit Kindern aus der Region

  Seit 2010 betreue ich in meiner Kindertagespflege, dem Kinderkörbchen in Eisingen, Kinder aus der Region, rund 100 waren es bis heute. 2026 kam die Ausbildung zur Babyschlafberaterin dazu. Wie der Alltag von Familien hier aussieht, mit Kita-Start, Job und Abenden, die sich ziehen, bekomme ich also schon lange mit.

  Ablauf und Preise sind vor Ort genau wie online, nachzulesen unter [Ablauf](ablauf.html) und [Kosten](preise.html).
