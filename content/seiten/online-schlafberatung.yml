text_1: |-
  ## Warum Schlafberatung online gut funktioniert

  Geschlafen wird nun mal zu Hause, und genau da sitzt ihr auch während des Gesprächs. Wenn ihr mögt, zeigt ihr mir kurz per Kamera, wo euer Kind schläft und wie euer Abend abläuft.

  ✓ Ihr müsst nirgendwohin fahren, schon gar nicht mit einem müden Baby
  ✓ Beide Eltern können dabei sein, auch von zwei Orten aus
  ✓ Ein Smartphone, Tablet oder Laptop reicht, ein Zoom-Konto braucht ihr nicht
  ✓ Rückfragen per WhatsApp beantworte ich in der Regel innerhalb von 24 Stunden

  ## Für Familien in ganz Deutschland

  Die Beratung läuft für alle Familien gleich ab, egal aus welchem Bundesland ihr kommt. Ob Hamburg, Berlin, Köln, Frankfurt, Stuttgart, München oder ein kleiner Ort auf dem Land, alles klappt komplett online. Gesprächszeiten sind montags bis freitags von 17 bis 19 Uhr und samstags von 9 bis 13 Uhr.

  Ich selbst wohne in Eisingen bei Würzburg. Wenn ihr aus der Gegend kommt, können wir auch einen [persönlichen Termin im Raum Würzburg](schlafberatung-wuerzburg.html) ausmachen.
text_2: |-
  ### Das braucht ihr

  Ein Gerät mit Kamera oder ein Telefon, etwa eine Stunde Ruhe für das Erstgespräch und, bei den Begleitungspaketen, einen ausgefüllten Fragebogen.
button_1: Kennenlernen anfragen
abschnitt_1:
  titel: So läuft die Online-Beratung
  text: Von eurer ersten Nachricht bis zur Begleitung danach.
schritte:
  - titel: Termin ausmachen
    text: Ihr schickt mir eure Anfrage, ich bestätige den Termin und schicke euch den Zoom-Link. Oder wir telefonieren, wenn euch das lieber ist.
  - titel: Gespräch von zu Hause
    text: Am Smartphone, Tablet oder Laptop, gern auch zu zweit.
  - titel: Der Plan kommt zu euch
    text: Euer schriftlicher Schlafplan kommt zu euch nach Hause, mit dem Baby müsst ihr dafür nirgendwohin.
  - titel: Rückfragen per WhatsApp
    text: Während der gebuchten Begleitzeit fragt ihr einfach dann, wenn im Alltag etwas auftaucht.
text_3: "## Fragen zur Online-Beratung"
button_2: Alle Fragen
fragen:
  - frage: Brauchen wir für Zoom ein eigenes Konto?
    antwort: Nein. Ihr bekommt einen Link von mir, das reicht. Teilnehmen könnt ihr am Smartphone genauso wie am Tablet oder Laptop. Und falls euch ein Videogespräch gar nicht liegt, telefonieren wir bei den Begleitungspaketen auch gern.
  - frage: Ist eine Beratung per Video genauso persönlich?
    antwort: Für eine Schlafberatung schon. Wir reden ausführlich über euren Alltag, darüber, wie eure Abende aussehen und was nachts passiert. Ihr sitzt dabei zu Hause und müsst mit dem Baby nirgendwohin fahren. Wenn ihr mögt, zeigt ihr mir den Schlafplatz kurz über die Kamera.
  - frage: Können beide Elternteile teilnehmen?
    antwort: Sehr gern, das geht auch, wenn einer von euch gerade woanders ist. Vor allem wenn ihr euch das Einschlafen in Zukunft besser aufteilen wollt, ist es gut, wenn ihr beide von Anfang an dabei seid.
  - frage: Wie bekommen wir den Schlafplan?
    antwort: Bei Basis, Intensiv und Premium bekommt ihr euren schriftlichen Plan innerhalb von 24 Stunden nach dem Beratungsgespräch, vorausgesetzt, die vereinbarten Unterlagen liegen mir vollständig vor. Rückfragen klären wir in eurer Begleitzeit per WhatsApp.
