seo:
  titel: Schlafberatung für Babys & Kleinkinder | Anna-Lena Korb
  beschreibung: "Schlafberatung für Kinder von 0 bis 6 Jahren: individueller Plan und Begleitung ohne Schreienlassen. Online deutschlandweit, vor Ort in Würzburg."
  menuename: Schlafberatung
kopf:
  titel: Schlafberatung für Babys und Kleinkinder
  text: Euer Ziel muss gar nicht „perfekt durchschlafen“ sein. Oft ist schon viel gewonnen, wenn der Abend wieder machbar ist und ihr wisst, woran ihr seid.
  bild: /assets/bilder/troesten.webp
  ausschnitt: 50% 35%
text_1: |-
  ## Was soll für euch leichter werden?

  Manche Eltern möchten nicht mehr jeden Abend stundenlang am Bett sitzen, andere wünschen sich, dass auch der andere Elternteil das Einschlafen übernehmen kann. Und manchmal hilft schon ein Blick von außen auf den Tagesablauf.

  Welches Ziel wir uns setzen, hängt davon ab, wie alt euer Kind ist und was es gerade braucht. Selbstständiger einzuschlafen kann so ein Ziel sein. Für jedes Kind muss es das aber nicht sein, und bei Neugeborenen ist es das sowieso nicht.

  Kontrolliertes Schreienlassen gehört **nicht zu meiner Arbeit**. Wenn euer Kind euch braucht, seid ihr da. Konsequent sein heißt für mich, freundlich bei dem zu bleiben, was wir vorher zusammen vereinbart haben.
text_2: "### Auf einen Blick"
liste_1:
  - begriff: Alter
    text: 0 bis 6 Jahre, ältere Kinder nach Absprache
  - begriff: Ort
    text: Online deutschlandweit, persönlich im Raum Würzburg
  - begriff: Erstgespräch
    text: 20 Minuten, kostenlos
  - begriff: Kosten
    text: ab 89 €, Gesamtpreise ohne Abo
button_1: Termin anfragen
abschnitt_1:
  titel: Für welches Alter und welche Situation?
  text: Auf den Unterseiten steht, worauf es im jeweiligen Alter ankommt und wie die Beratung online oder vor Ort abläuft.
text_3: "## Jedes Alter braucht etwas anderes"
liste_2:
  - begriff: 0–3 Monate · Neugeborene
    text: Hier geht es um Orientierung, einen sicheren Schlafplatz und um Entlastung für euch. Schlaftraining ist in diesem Alter kein Thema. [Schlafberatung für Babys](schlafberatung-baby.html)
  - begriff: 4–12 Monate · Babys
    text: Tagesrhythmus, Einschlafbegleitung und häufiges nächtliches Aufwachen. [Schlafberatung für Babys](schlafberatung-baby.html)
  - begriff: 1–3 Jahre · Kleinkinder
    text: Einschlafen nur mit einer Person, Tagschlaf, Kita-Start und neue Abläufe. [Schlafberatung für Kleinkinder](schlafberatung-kleinkind.html)
  - begriff: 3–6 Jahre · Kindergartenkinder
    text: Abendroutinen, Ängste beim Einschlafen und nächtliches Wandern ins Elternbett. [Schlafberatung für Kleinkinder](schlafberatung-kleinkind.html)
foto_1:
  bild: /assets/bilder/einschlafen.webp
  ausschnitt: 50% 50%
text_4: |-
  ## Eure Geschichte gehört dazu

  Im Fragebogen geht es um euren Alltag, darum, wie euer Kind bisher schläft, und um eure Wünsche. Wenn ihr möchtet und es für die Beratung wichtig ist, können wir auch über Schwangerschaft, Geburt und die erste Zeit mit eurem Kind sprechen.

  Eine Geburtsgeschichte erklärt allerdings nicht einfach so ein Schlafproblem. Diagnosen stelle ich keine, und eine medizinische oder therapeutische Behandlung ersetzt die Schlafberatung nicht.
button_2: So läuft die Beratung ab
abschnitt_2:
  titel: Worauf ihr euch einlasst
  text: Damit ihr vorher wisst, was euch bei mir erwartet.
text_5: |-
  ### Darauf könnt ihr euch verlassen

  ✓ Einen Plan, der zum Alter eures Kindes und zu eurem Alltag passt
  ✓ Begleitung, während ihr den Plan umsetzt
  ✓ Erklärungen, die ihr ohne Fachwissen versteht
  ✓ Höchstens drei Familien gleichzeitig, damit ich genug Zeit für euch habe
text_6: |-
  ### Was es bei mir nicht gibt

  ✗ Kontrolliertes Schreienlassen
  ✗ Eine Durchschlafgarantie nach soundso vielen Nächten
  ✗ Die Pflicht, abzustillen oder euer Baby ins Kinderzimmer umzuziehen
  ✗ Vorwürfe, weil ihr eurem Kind beim Einschlafen nah seid
