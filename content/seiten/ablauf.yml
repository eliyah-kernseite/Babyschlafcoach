seo:
  titel: Ablauf der Babyschlafberatung | Anna-Lena Korb
  beschreibung: "So läuft die Schlafberatung ab: kostenloses Kennenlernen, Fragebogen, persönliches Gespräch, schriftlicher Plan und Begleitung per WhatsApp."
  menuename: Ablauf
kopf:
  titel: So läuft die Schlafberatung ab
  text: Hier steht, was euch nach der Anfrage erwartet und wie die Beratung Schritt für Schritt läuft. Die Schlafsprechstunde ist für eine einzelne Frage gedacht, bei den Begleitungspaketen gehen wir deutlich ausführlicher vor.
abschnitt_1:
  titel: Vom ersten Gespräch bis zur Begleitung
  text: Bei den Paketen gehören alle vier Schritte dazu. Bei der Schlafsprechstunde gibt es keinen vollständigen Plan und keine Begleitung danach.
schritte:
  - titel: Erst einmal erzählen
    text: 20 Minuten, kostenlos. Ihr erzählt, was gerade schwierig ist und was ihr euch wünscht, und entscheidet danach, ob ihr eine Beratung möchtet.
  - titel: Eure Situation verstehen
    text: Mit Fragebogen, Schlafprotokoll und einem ausführlichen Gespräch schauen wir genauer hin. Wenn ihr möchtet, ist dabei auch Platz für eure Familiengeschichte.
  - titel: Der schriftliche Plan
    text: Bei Basis, Intensiv und Premium habt ihr innerhalb von 24 Stunden nach dem Gespräch euren Plan, mit konkreten nächsten Schritten.
  - titel: Ausprobieren und nachjustieren
    text: Je nach Angebot begleite ich euch sieben Tage, drei oder sechs Wochen lang. Ein Plan muss im echten Familienalltag funktionieren, und wo er noch hakt, merkt man meistens erst beim Ausprobieren.
