text_1: "## 1. Anbieterin und Geltungsbereich"
text_2: |-
  Diese Bedingungen gelten für individuell vereinbarte Leistungen im Bereich Babyschlafberatung. Individuelle Vereinbarungen haben Vorrang.

  ## 2. Anfrage und Vertragsschluss

  Die Website informiert über Leistungen und Preise. Die Terminauswahl und die Paketlinks bereiten unverbindliche Anfragen vor; sie lösen keine Zahlungspflicht aus. Nach der Anfrage erhältst du ein konkretes Angebot einschließlich Leistungsumfang, Preis, Terminabsprachen und Vertragsinformationen. Ein Vertrag entsteht durch gesonderte Vereinbarung auf dieser Grundlage.

  ## 3. Umfang der Beratung

  Maßgeblich ist der im Angebot vereinbarte Umfang. Die Beratung berücksichtigt eure Angaben und euren Familienalltag. Sie beinhaltet keine medizinische Diagnostik oder Therapie. Ein bestimmtes Schlafverhalten oder ein Erfolg innerhalb einer bestimmten Zeit wird nicht geschuldet.

  WhatsApp-Begleitung gilt im vereinbarten Zeitraum. Antworten erfolgen in der Regel innerhalb von 24 Stunden; sonntags und an Feiertagen am nächsten Beratungstag. Sie bedeutet keine ununterbrochene Erreichbarkeit und ist kein Notfalldienst.

  ## 4. Preise und Zahlung

  Die ausgewiesenen Preise sind Gesamtpreise. Die Zahlung ist vor Leistungsbeginn fällig, sofern im Angebot nichts anderes vereinbart wird. Zahlungsweg und gegebenenfalls eine Ratenzahlung werden im Angebot geregelt. Zusätzliche Leistungen oder Kosten werden nur nach vorheriger Vereinbarung berechnet.

  ## 5. Termine und Beendigung

  Bitte teile notwendige Terminänderungen frühzeitig mit. Bis 24 Stunden vor einem Termin ist eine Verschiebung kostenfrei möglich. Im Übrigen gelten die individuellen Vereinbarungen und gesetzlichen Regelungen. Gesetzliche Widerrufs- und Kündigungsrechte bleiben unberührt. Es gibt keine automatische Verlängerung der Begleitung.

  ## 6. Mitwirkung und Vertraulichkeit

  Für die Beratung sind zutreffende Informationen über eure Situation erforderlich. Die praktische Umsetzung bleibt in eurer Verantwortung. Persönliche Angaben werden vertraulich und nach Maßgabe der Datenschutzhinweise verarbeitet.

  ## 7. Haftung

  Es gelten die gesetzlichen Haftungsregelungen.

  ## 8. Widerruf und Verbraucherrechte

  Bei Fernabsatzverträgen steht Verbrauchern grundsätzlich ein gesetzliches Widerrufsrecht zu. Die [Widerrufsbelehrung und das Muster-Widerrufsformular](widerruf.html) sind gesondert aufgeführt und werden im Rahmen des Vertragsschlusses zur Verfügung gestellt.

  ## 9. Beratungsunterlagen

  Schlafpläne und Unterlagen sind für den persönlichen Gebrauch innerhalb der beratenen Familie bestimmt. Gesetzlich erlaubte Nutzungen bleiben unberührt.

  ## 10. Anwendbares Recht

  Es gilt deutsches Recht. Zwingender Verbraucherschutz des Staates deines gewöhnlichen Aufenthalts bleibt erhalten. Für den Gerichtsstand gelten die gesetzlichen Vorschriften.
