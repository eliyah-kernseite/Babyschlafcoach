# Pages CMS (https://app.pagescms.org): which content files can be edited and how.
# Each save is a commit on main. The workflow "Branch live aktualisieren" then rebuilds the pages and publishes them.
media:
  - name: bilder
    label: Fotos
    input: assets/bilder
    output: /assets/bilder
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe
content:
  - name: einstellungen
    label: "Einstellungen: Kontakt, Preise, Kopf- und Fußzeile"
    type: file
    path: content/einstellungen.yml
    fields:
      - name: kontakt
        label: Kontaktdaten
        type: object
        fields:
          - name: email
            label: E-Mail-Adresse
            type: string
            description: Auch Empfänger der Terminanfragen. Bei einer neuen Adresse muss sie zuerst bei Web3Forms bestätigt werden.
          - name: telefon_anzeige
            label: Telefon (so wie es angezeigt wird)
            type: string
          - name: telefon_nummer
            label: Telefon zum Anrufen
            type: string
            description: Internationale Schreibweise ohne Leerzeichen, z. B. +491731234567
          - name: kinderkoerbchen_url
            label: Webseite Kinderkörbchen
            type: string
      - name: angebote
        label: Angebote und Preise
        type: object
        fields:
          - name: id
            label: Kennung
            type: string
            readonly: true
          - name: name
            label: Name
            type: string
          - name: preis
            label: Preis in Euro
            type: number
            options:
              min: 0
          - name: minuten
            label: Dauer des Termins in Minuten
            type: number
            options:
              min: 10
          - name: leistung
            label: Leistung (Preistabelle auf der Startseite)
            type: string
        description: Preise gelten automatisch für Preistabelle, Paketkarten und Terminformular. Preise, die in Fließtexten stehen (z. B. in den Fragen), bitte dort zusätzlich ändern.
        list:
          min: 5
          max: 5
          collapsible:
            collapsed: true
            summary: "{name}: {preis} €"
      - name: kopfzeile
        label: Zeile ganz oben
        type: object
        fields:
          - name: text
            label: Text
            type: string
          - name: zeiten
            label: Gesprächszeiten
            type: string
      - name: fusszeile
        label: Fußzeile
        type: object
        fields:
          - name: text
            label: Text unter dem Logo
            type: text
          - name: adresse
            label: Adresse
            type: text
            description: Neue Zeile = Zeilenumbruch.
          - name: zeiten
            label: Gesprächszeiten
            type: string
          - name: copyright
            label: Copyright-Zeile
            type: string
      - name: kontaktbereich
        label: Kontaktbereich am Ende jeder Seite
        type: object
        fields:
          - name: titel
            label: Überschrift (Standard)
            type: string
          - name: text
            label: Text
            type: text
          - name: button
            label: Button
            type: string
          - name: zeiten
            label: Gesprächszeiten
            type: string
          - name: standort
            label: Standort
            type: string
      - name: kinderkoerbchen
        label: Kasten Kinderkörbchen (Über mich)
        type: object
        fields:
          - name: vorzeile
            label: Kleine Zeile oben
            type: string
          - name: titel
            label: Überschrift
            type: string
          - name: text
            label: Text
            type: text
          - name: button
            label: Button
            type: string
          - name: fakten
            label: Fakten
            type: object
            fields:
              - name: begriff
                label: Begriff
                type: string
              - name: text
                label: Text
                type: string
            list: true
      - name: portraet
        label: Zitat neben dem Logo (Über mich)
        type: object
        fields:
          - name: zitat
            label: Zitat
            type: text
          - name: unterzeile
            label: Zeile unter dem Namen
            type: string
  - name: fotos
    label: "Fotos: Beschreibungen und Bildnachweise"
    type: file
    path: content/fotos.yml
    fields:
      - name: fotos
        label: Fotos
        type: object
        fields:
          - name: bild
            label: Foto
            type: image
            options:
              media: bilder
          - name: beschreibung
            label: Bildbeschreibung für Screenreader und Google (Alt-Text)
            type: text
          - name: motiv
            label: Motiv (für die Bildnachweise)
            type: string
          - name: fotograf
            label: Fotograf oder Fotografin
            type: string
            description: Leer lassen bei eigenen Fotos, dann erscheint das Foto nicht in den Bildnachweisen.
          - name: quelle
            label: Quelle (Link)
            type: string
        description: Jedes Foto, das auf der Seite verwendet wird, braucht hier einen Eintrag mit Bildbeschreibung.
        list:
          collapsible:
            collapsed: true
            summary: "{motiv}"
  - name: bausteine
    label: Bausteine auf mehreren Seiten
    type: file
    path: content/bausteine.yml
    fields:
      - name: schwerpunkte
        label: Kacheln Schwerpunkte (Startseite, Schlafberatung, Würzburg)
        type: object
        fields:
          - name: seite
            label: Seite
            type: string
            readonly: true
          - name: titel
            label: Titel
            type: string
          - name: text
            label: Text
            type: string
          - name: bild
            label: Foto
            type: image
            options:
              media: bilder
          - name: ausschnitt
            label: Bildausschnitt
            type: string
            description: "Welcher Teil des Fotos sichtbar bleibt: erst waagerecht, dann senkrecht, z. B. 50% 30% (Mitte, eher oben)."
        list:
          min: 4
          max: 4
          collapsible:
            collapsed: true
            summary: "{titel}"
      - name: ratgeber_titel
        label: Überschrift über den Ratgeber-Kacheln unter Artikeln
        type: string
      - name: ratgeber
        label: Kacheln Ratgeber-Artikel
        type: object
        fields:
          - name: seite
            label: Seite
            type: string
            readonly: true
          - name: titel
            label: Titel
            type: string
          - name: bild
            label: Foto
            type: image
            options:
              media: bilder
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "{titel}"
      - name: zertifikat
        label: Bildunterschrift Zertifikat
